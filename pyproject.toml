[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lattice-explorer"
version = "0.1.0"
description = "Local pure-gauge Monte Carlo and potential explorer"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "numpy>=2,<3", "scipy>=1.14,<2", "h5py>=3.12,<4", "scikit-learn>=1.6,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.28"]

[project.scripts]
lattice-explorer = "analysis.cli:main"

[tool.setuptools]
packages = ["analysis"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
