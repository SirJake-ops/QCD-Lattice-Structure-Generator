schema_version = 1

[model]
gauge_group = "u1"
action = "wilson"
beta = 1.0

[lattice]
extents = [8, 8, 8, 16]
boundary = "periodic"
spacing = 1.0

[sampling]
seed = 12345
warmup_sweeps = 1000
measurement_sweeps = 5000
sweeps_between_measurements = 10
chains = 1

[update]
algorithm = "metropolis"
proposal_scale = 0.25

[observables]
plaquette = true
polyakov_loop = false
wilson_loops = [[1, 1], [1, 2], [2, 2]]

[execution]
backend = "cpu"
precision = "double"
threads = 1

[output]
directory = "results/default"
format = "csv"
save_configurations = false
configuration_interval = 100
